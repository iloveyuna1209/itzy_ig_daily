name: Update Recent YouTube Videos

on:
  schedule:
    # 每天台灣時間 12:00 (UTC 04:00) 自動抓取最新 5 支長影片
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest ITZY YouTube videos & identify members
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_videos.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.js
          if git diff --cached --quiet; then
            echo "No changes to data/videos.js"
          else
            git commit -m "chore(videos): 自動更新最新 5 支 ITZY 近期影片"
            git push
          fi
